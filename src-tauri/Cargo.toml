[package]
name = "omniconvert"
version = "1.0.0"
description = "OmniConvert – Univerzális Offline Fájlkonvertáló, PDF Szerkesztő és Dokumentum-Feloldó Desktop App"
authors = ["OmniConvert Team"]
license = "MIT"
repository = "https://github.com/kaposvarikazmer-ctrl/konvertalo-app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "omniconvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
rayon = "1.10"
infer = "0.16"
mime_guess = "2.0"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "ico",
  "tga",
  "pnm",
  "dds",
  "tiff",
  "qoi",
  "avif",
] }
resvg = "0.44"
kamadak-exif = "0.5"
calamine = "0.26"
rust_xlsxwriter = "0.79"
csv = "1.3"
serde_yaml = "0.9"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "=2.2.2", default-features = false, features = ["deflate", "aes-crypto", "time"] }
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.4"
lzma-rs = "0.3"
sevenz-rust = { version = "0.6", features = ["aes256"] }
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
walkdir = "2.5"
tempfile = "3.13"
thiserror = "2.0"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-shell = "2.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.build-dependencies]
tauri-build = { version = "2.0", features = [] }
